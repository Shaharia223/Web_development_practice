<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Our Story in Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --your-name: "Shaharia Mahmud";
    --bg-deep:#5A2B3F;
    --bg-mid:#7A3E57;
    --bg-soft:#A85D79;
    --rose:#E86D98;
    --rose-dark:#CC4F7C;
    --blush:#FFF0F5;
    --ivory:#FFF9F2;
    --gold:#E8C36A;
    --text:#FFF8FB;
    --muted:rgba(255,248,251,0.76);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  #ambient{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 68% 46% at 15% 12%, rgba(255,214,228,0.30), transparent 62%),
      radial-gradient(ellipse 55% 40% at 88% 78%, rgba(232,195,106,0.17), transparent 60%),
      linear-gradient(160deg, var(--bg-soft) 0%, var(--bg-mid) 52%, var(--bg-deep) 100%);
  }

  .heart-float{
    position:fixed; z-index:1; pointer-events:none; user-select:none;
    opacity:0;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));
    animation:heart-rise linear infinite;
  }
  @keyframes heart-rise{
    0%   { transform:translateY(0) translateX(0) scale(.9); opacity:0; }
    10%  { opacity:.9; }
    55%  { opacity:.95; }
    100% { transform:translateY(-118vh) translateX(var(--drift,28px)) scale(1.12); opacity:0; }
  }

  #stage{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .chapter-label{
    position:absolute; top:36px; left:0; right:0;
    text-align:center;
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--rose);
    font-weight:600;
  }
  .chapter-label .roman{ color:var(--gold); margin-right:8px; }

  .card{
    width:100%; max-width:540px;
    background:rgba(255,249,242,0.10);
    border:1px solid rgba(232,195,106,0.42);
    border-radius:12px;
    padding:56px 34px 42px;
    text-align:center;
    position:relative;
    backdrop-filter:blur(8px);
    box-shadow:0 14px 40px rgba(68,24,43,.25), inset 0 1px 0 rgba(255,255,255,.18);
    animation:card-in .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes card-in{
    from { opacity:0; transform:translateY(14px) scale(.985); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .card::before,.card::after{
    content:"";
    position:absolute;
    width:24px; height:24px;
    border:1px solid rgba(232,195,106,.68);
    border-radius:3px;
  }
  .card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .mascot{ width:150px; margin:0 auto 16px; }
  .mascot svg{
    width:100%; display:block;
    animation:mascot-bob 3.2s ease-in-out infinite;
    transform-origin:center bottom;
  }
  @keyframes mascot-bob{
    0%,100%{ transform:translateY(0) rotate(0); }
    50%{ transform:translateY(-4px) rotate(-.6deg); }
  }
  .mascot.jitter svg{
    animation:mascot-bob 3.2s ease-in-out infinite, mascot-jitter .35s ease-in-out infinite;
  }
  @keyframes mascot-jitter{
    0%,100%{ margin-left:0; }
    50%{ margin-left:2px; }
  }
  .mascot.shoo svg{ animation:mascot-shoo .4s ease; }
  @keyframes mascot-shoo{
    0%{ transform:rotate(0); }
    30%{ transform:rotate(-6deg) translateX(-3px); }
    60%{ transform:rotate(5deg) translateX(3px); }
    100%{ transform:rotate(0); }
  }

  .question{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(28px,6vw,40px);
    line-height:1.24;
    margin:0 0 10px;
    color:var(--ivory);
  }
  .subtext{
    margin:0 0 28px;
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    color:var(--muted);
    font-style:italic;
  }

  .btn-row{
    position:relative;
    min-height:66px;
    display:flex; align-items:center; justify-content:center;
    gap:14px; flex-wrap:wrap;
  }

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:999px;
    padding:13px 28px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease, opacity .25s ease, background .25s ease;
  }
  button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  .btn-yes{
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    color:#fff9fc;
    box-shadow:0 8px 22px rgba(232,109,152,.36);
  }
  .btn-yes:hover{
    transform:translateY(-2px);
    box-shadow:0 11px 28px rgba(232,109,152,.45);
  }

  .btn-no{
    background:transparent;
    color:rgba(255,248,251,.84);
    border:1px solid rgba(255,248,251,.44);
    position:relative;
  }
  #noBtn.evading{ position:fixed; z-index:55; }

  .btn-moment{
    background:rgba(255,248,251,.14);
    color:rgba(255,248,251,.94);
    border:1px solid rgba(255,248,251,.40);
  }

  .hint{
    margin-top:23px;
    font-size:12px;
    color:rgba(255,248,251,.56);
    letter-spacing:.02em;
  }

  /* memory chapter */
  .memory-wrap{ margin:0 0 10px; }
  .memory-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:8px auto 18px;
    max-width:360px;
  }
  .memory-star{
    border:1px solid rgba(232,195,106,.56);
    background:rgba(255,249,242,.16);
    color:#fffafd;
    border-radius:12px;
    padding:11px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .memory-star:hover{
    transform:translateY(-1px);
    border-color:rgba(232,195,106,.8);
  }

  /* hidden at start; shows only after star click */
  .memory-photo-wrap{
    width:100%;
    max-width:340px;
    margin:0 auto 12px;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(232,195,106,.55);
    background:rgba(255,255,255,.08);
    box-shadow:0 10px 28px rgba(0,0,0,.24);
    position:relative;
    display:none;
  }

  .memory-photo{
    display:block;
    width:100%;
    height:220px;
    object-fit:contain;
    opacity:0;
    transform:scale(1.025);
    transition:opacity .55s ease, transform .9s ease;
  }
  .memory-photo.show{
    opacity:1;
    transform:scale(1);
  }

  .memory-photo-overlay{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.26) 0%, rgba(0,0,0,.04) 55%, transparent 100%);
    pointer-events:none;
  }

  .memory-photo-caption{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(255,248,251,.78);
    padding:8px 10px 9px;
    border-top:1px solid rgba(232,195,106,.3);
    background:rgba(0,0,0,.14);
  }

  .memory-note{
    min-height:52px;
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    line-height:1.35;
    color:var(--blush);
    margin:0 auto 8px;
    max-width:430px;
    transition:opacity .35s ease, transform .35s ease;
  }
  .memory-note.updating{
    opacity:.25;
    transform:translateY(3px);
  }

  .name-field{ margin:0 0 26px; }
  .name-field label{
    display:block;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(255,248,251,.62);
    margin-bottom:10px;
  }
  .name-field input{
    width:230px;
    max-width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(232,195,106,.75);
    text-align:center;
    color:var(--text);
    font-family:'Cormorant Garamond',serif;
    font-size:23px;
    padding:6px 4px;
    outline:none;
  }
  .name-field input::placeholder{ color:rgba(255,248,251,.45); }

  .ring-wrap{ margin:0 auto 25px; width:120px; height:120px; }
  .ring-wrap svg{ width:100%; height:100%; }
  .ring-band{
    fill:none; stroke:var(--gold); stroke-width:6;
    stroke-linecap:round;
    stroke-dasharray:220; stroke-dashoffset:220;
    animation:draw-ring 1.1s ease forwards .15s;
  }
  .ring-stone{
    fill:var(--gold); opacity:0;
    animation:pop-stone .4s ease forwards 1.1s;
  }
  @keyframes draw-ring{ to{ stroke-dashoffset:0; } }
  @keyframes pop-stone{ from{opacity:0; transform:scale(0);} to{opacity:1; transform:scale(1);} }

  .final-title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(30px,7vw,44px);
    font-weight:600;
    margin:0 0 6px;
    color:var(--ivory);
  }
  .final-sub{
    margin:0 0 2px;
    font-family:'Cormorant Garamond',serif;
    font-size:19px;
    color:var(--muted);
    font-style:italic;
  }
  .signature{
    margin-top:26px;
    font-size:12px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:rgba(232,195,106,.95);
  }
  .gentle-note{
    margin-top:16px;
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    color:var(--blush);
    min-height:26px;
  }

  #confettiCanvas{
    position:fixed; inset:0; z-index:45;
    pointer-events:none;
  }

  /* certificate */
  .certificate-wrap{
    margin-top:24px;
    opacity:0;
    transform:translateY(10px);
    animation:cert-in .6s ease forwards .3s;
  }
  @keyframes cert-in{
    to{ opacity:1; transform:translateY(0); }
  }
  .cert-preview{
    display:block;
    width:100%;
    max-width:380px;
    margin:0 auto 14px;
    border-radius:10px;
    border:1px solid rgba(232,195,106,.55);
    box-shadow:0 12px 30px rgba(0,0,0,.32);
  }
  .btn-download{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(135deg, var(--gold), #C9A13F);
    color:#3A2410;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:999px;
    padding:12px 26px;
    box-shadow:0 8px 20px rgba(232,195,106,.35);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn-download:hover{
    transform:translateY(-2px);
    box-shadow:0 11px 26px rgba(232,195,106,.45);
  }

  .fade-out{ animation:fade-out .4s ease forwards; }
  @keyframes fade-out{ to{ opacity:0; transform:scale(.97); } }

  @media (max-width:440px){
    .card{ padding:44px 20px 32px; }
    .memory-grid{ grid-template-columns:1fr; max-width:240px; }
    .memory-photo-wrap,.memory-photo{ max-width:100%; }
  }

  @media (prefers-reduced-motion:reduce){
    *{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="ambient"></div>
<canvas id="confettiCanvas"></canvas>

<div id="stage">
  <div class="chapter-label" id="chapterLabel"><span class="roman">I.</span> A QUESTION</div>
  <div class="card" id="card"></div>
</div>

<script>
/* Replace photo paths with your real images */
const chapters = [
  {
    roman:"I.",
    label:"A Question",
    question:"Do you believe in second glances?",
    subtext:"Because I keep finding reasons to look at you again.",
    hint:"just one honest answer"
  },
  {
    roman:"II.",
    label:"A Little More Time",
    question:"Can I steal a little more of your time — maybe the rest of it?",
    subtext:"No pressure. Just forever.",
    hint:"the second one is trickier, I know"
  },
  {
    roman:"III.",
    label:"No Turning Back",
    question:"Are you ready for where this is going?",
    subtext:"There’s no real exit after this chapter.",
    hint:"last chance to reconsider (not really)"
  }
];

const memoryCards = [
  { title:"✨ The sparkling start", text:"The day we met, something in me got quiet — like my heart recognized home.", photo:"images/star1.jpg" },
  { title:"🌙 My favorite moments", text:"Those evenings with you still replay in my head like songs I would never skip.", photo:"images/star2.jpg" },
  { title:"💖 The moment I knew", text:"Somewhere between your laugh and your kindness, I knew it had always been you.", photo:"images/star3.jpg" }
];

let currentChapter = 0;
let noAttempts = 0;

const chapterLabelEl = document.getElementById("chapterLabel");
const cardEl = document.getElementById("card");
const INK = "#2A1B22";

function star(cx, cy, r){
  return `<path d="M${cx} ${cy-r} L${cx+r*0.35} ${cy-r*0.35} L${cx+r} ${cy} L${cx+r*0.35} ${cy+r*0.35} L${cx} ${cy+r} L${cx-r*0.35} ${cy+r*0.35} L${cx-r} ${cy} L${cx-r*0.35} ${cy-r*0.35} Z" fill="#E8C36A"/>`;
}
function bunnyEars(perk){
  const rot = perk ? 16 : 34;
  const cy  = perk ? 52 : 58;
  return `
    <ellipse cx="118" cy="${cy}" rx="9" ry="25" transform="rotate(-${rot} 118 ${cy})" fill="#C9B4EC"/>
    <ellipse cx="172" cy="${cy}" rx="9" ry="25" transform="rotate(${rot} 172 ${cy})" fill="#C9B4EC"/>
    <ellipse cx="118" cy="${cy+2}" rx="4" ry="16" transform="rotate(-${rot} 118 ${cy+2})" fill="#E8DCF8"/>
    <ellipse cx="172" cy="${cy+2}" rx="4" ry="16" transform="rotate(${rot} 172 ${cy+2})" fill="#E8DCF8"/>
  `;
}
const bearBase = `
  <circle cx="28" cy="38" r="13" fill="#D2A076"/><circle cx="82" cy="38" r="13" fill="#D2A076"/>
  <circle cx="28" cy="40" r="6" fill="#F3D7BB"/><circle cx="82" cy="40" r="6" fill="#F3D7BB"/>
  <circle cx="55" cy="70" r="36" fill="#D2A076"/>
  <circle cx="30" cy="78" r="6" fill="#F194AE" opacity="0.58"/><circle cx="80" cy="78" r="6" fill="#F194AE" opacity="0.58"/>
  <path d="M40,100 Q55,112 70,100 Z" fill="#E85D8A"/><circle cx="55" cy="99" r="3.5" fill="#C7436E"/>
`;
const bunnyBlush = `<circle cx="122" cy="82" r="6" fill="#F194AE" opacity="0.58"/><circle cx="168" cy="82" r="6" fill="#F194AE" opacity="0.58"/>`;
const bunnyHead  = `<circle cx="145" cy="72" r="34" fill="#C9B4EC"/>`;
const bunnyFlower = `
  <circle cx="102" cy="46" r="3.4" fill="#FFE4EE"/><circle cx="108" cy="43" r="3.4" fill="#FFE4EE"/>
  <circle cx="112" cy="49" r="3.4" fill="#FFE4EE"/><circle cx="107" cy="53" r="3.4" fill="#FFE4EE"/>
  <circle cx="100" cy="51" r="3.4" fill="#FFE4EE"/><circle cx="106" cy="48" r="2.6" fill="#E8C36A"/>
`;

function buildMascot(mood){
  let bearEyes, bearMouth, bunnyEyes, bunnyMouth, extras="", ears, arms="";
  if (mood==="shy"){
    ears = bunnyEars(false);
    bearEyes = `<path d="M40,68 q5,-7 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M65,68 q5,-7 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    bearMouth = `<path d="M48,84 q7,5 14,0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    bunnyEyes = `<path d="M132,70 q5,-7 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M155,70 q5,-7 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    bunnyMouth = `<path d="M138,86 q7,5 14,0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  } else if (mood==="hopeful"){
    ears = bunnyEars(true);
    bearEyes = `<circle cx="45" cy="66" r="4.2" fill="${INK}"/><circle cx="43.5" cy="64.5" r="1.2" fill="#fff"/><circle cx="75" cy="66" r="4.2" fill="${INK}"/><circle cx="73.5" cy="64.5" r="1.2" fill="#fff"/>`;
    bearMouth = `<path d="M45,84 q10,10 20,0" stroke="${INK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    bunnyEyes = `<circle cx="137" cy="68" r="4" fill="${INK}"/><circle cx="135.6" cy="66.6" r="1.1" fill="#fff"/><circle cx="160" cy="68" r="4" fill="${INK}"/><circle cx="158.6" cy="66.6" r="1.1" fill="#fff"/>`;
    bunnyMouth = `<path d="M135,86 q10,9 20,0" stroke="${INK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  } else if (mood==="nervous"){
    ears = bunnyEars(false);
    bearEyes = `<circle cx="45" cy="67" r="3" fill="${INK}"/><circle cx="75" cy="67" r="3" fill="${INK}"/><path d="M39,58 q6,-4 11,0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M69,58 q6,-4 11,0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    bearMouth = `<ellipse cx="55" cy="86" rx="3.5" ry="4.5" fill="${INK}"/>`;
    bunnyEyes = `<circle cx="137" cy="69" r="2.8" fill="${INK}"/><circle cx="160" cy="69" r="2.8" fill="${INK}"/><path d="M131,60 q6,-4 11,0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M155,60 q6,-4 11,0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    bunnyMouth = `<ellipse cx="145" cy="88" rx="3" ry="4" fill="${INK}"/>`;
    extras = `<path d="M92,38 q3,6 0,10 q-3,-4 0,-10 Z" fill="#A8D4EB" opacity=".85"/>`;
  } else if (mood==="ring"){
    ears = bunnyEars(true);
    bearEyes = `<circle cx="45" cy="66" r="4.2" fill="${INK}"/><circle cx="43.5" cy="64.5" r="1.2" fill="#fff"/><circle cx="75" cy="66" r="4.2" fill="${INK}"/><circle cx="73.5" cy="64.5" r="1.2" fill="#fff"/>`;
    bearMouth = `<path d="M45,84 q10,10 20,0" stroke="${INK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    bunnyEyes = star(137,68,5)+star(160,68,5);
    bunnyMouth = `<path d="M135,86 q10,9 20,0" stroke="${INK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    extras = `
      <circle cx="38" cy="104" r="6" fill="#D2A076"/><circle cx="72" cy="104" r="6" fill="#D2A076"/>
      <rect x="42" y="95" width="26" height="18" rx="3" fill="#4A2A3E" stroke="#E8C36A" stroke-width="1.5"/>
      <rect x="42" y="95" width="26" height="7" rx="3" fill="#5E3550"/>
      <circle cx="55" cy="104" r="3.5" fill="#E8C36A"/>
    `;
  } else {
    ears = bunnyEars(true);
    bearEyes = `<path d="M40,66 q5,-8 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M65,66 q5,-8 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    bearMouth = `<ellipse cx="55" cy="86" rx="7" ry="6" fill="${INK}"/>`;
    bunnyEyes = `<path d="M132,68 q5,-8 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M155,68 q5,-8 10,0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    bunnyMouth = `<ellipse cx="145" cy="88" rx="7" ry="6" fill="${INK}"/>`;
    arms = `
      <ellipse cx="18" cy="48" rx="7" ry="16" fill="#D2A076" transform="rotate(-30 18 48)"/>
      <ellipse cx="92" cy="48" rx="7" ry="16" fill="#D2A076" transform="rotate(30 92 48)"/>
      <ellipse cx="110" cy="50" rx="6" ry="15" fill="#C9B4EC" transform="rotate(-28 110 50)"/>
      <ellipse cx="180" cy="50" rx="6" ry="15" fill="#C9B4EC" transform="rotate(28 180 50)"/>
    `;
  }

  return `
    <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
      ${arms}
      ${bearBase}
      ${bearEyes}
      ${bearMouth}
      ${ears}
      ${bunnyHead}
      ${bunnyBlush}
      ${bunnyFlower}
      ${bunnyEyes}
      ${bunnyMouth}
      ${extras}
    </svg>
  `;
}

const MOODS = ["shy","hopeful","nervous"];
function mascotHtml(mood, extraClass=""){
  return `<div class="mascot${extraClass ? " "+extraClass : ""}" id="mascot">${buildMascot(mood)}</div>`;
}

function renderChapter(){
  const c = chapters[currentChapter];
  chapterLabelEl.innerHTML = `<span class="roman">${c.roman}</span> ${c.label.toUpperCase()}`;
  const mood = MOODS[currentChapter] || "shy";

  cardEl.innerHTML = `
    ${mascotHtml(mood, mood==="nervous" ? "jitter" : "")}
    <p class="question">${c.question}</p>
    <p class="subtext">${c.subtext}</p>
    <div class="btn-row">
      <button class="btn-yes" id="yesBtn">Yes</button>
      <button class="btn-no" id="noBtn">No</button>
    </div>
    <p class="hint">${c.hint}</p>
  `;

  attachHandlers();
}

function attachHandlers(){
  const yesBtn = document.getElementById("yesBtn");
  const noBtn  = document.getElementById("noBtn");

  yesBtn.addEventListener("click", advance);

  const evadeOnHover = () => { noAttempts++; dodge(noBtn); };
  noBtn.addEventListener("mouseenter", evadeOnHover);
  noBtn.addEventListener("touchstart", (e)=>{ e.preventDefault(); evadeOnHover(); }, { passive:false });

  noBtn.addEventListener("click", (e)=>{
    if (currentChapter >= 1){
      e.preventDefault();
      noAttempts++;
      dodge(noBtn);
    }
  });
}

function dodge(noBtn){
  const stage = document.getElementById("stage");
  const rect = stage.getBoundingClientRect();
  const btnW = noBtn.offsetWidth || 90;
  const btnH = noBtn.offsetHeight || 46;

  noBtn.classList.add("evading");

  const shrink = Math.max(.58, 1 - noAttempts*.06);
  const fade   = Math.max(.36, 1 - noAttempts*.05);
  noBtn.style.transform = `scale(${shrink})`;
  noBtn.style.opacity = fade;

  const margin = 16;
  const maxX = Math.max(margin, rect.width - btnW - margin);
  const maxY = Math.max(margin, rect.height - btnH - margin);
  const newX = margin + Math.random()*(maxX - margin);
  const newY = margin + Math.random()*(maxY - margin);

  noBtn.style.left = `${rect.left + newX}px`;
  noBtn.style.top  = `${rect.top + newY}px`;

  const mascot = document.getElementById("mascot");
  if (mascot){
    mascot.classList.add("shoo");
    setTimeout(()=>mascot.classList.remove("shoo"), 400);
  }
}

function advance(){
  cardEl.classList.add("fade-out");
  setTimeout(()=>{
    cardEl.classList.remove("fade-out");
    currentChapter++;
    if (currentChapter < chapters.length){
      renderChapter();
    } else {
      renderMemoryChapter();
    }
  }, 380);
}

/* IV: photo hidden initially, appears only after star click */
function renderMemoryChapter(){
  chapterLabelEl.innerHTML = `<span class="roman">IV.</span> CONSTELLATION OF US`;

  cardEl.innerHTML = `
    ${mascotHtml("hopeful")}
    <div class="memory-wrap">
      <p class="question" style="font-size:clamp(26px,5.5vw,36px); margin-bottom:6px;">A few stars from our story ✨</p>
      <p class="subtext" style="margin-bottom:16px;">Tap each one. They all point to you.</p>

      <div class="memory-grid">
        ${memoryCards.map((m,i)=>`<button class="memory-star" data-i="${i}" type="button">${m.title}</button>`).join("")}
      </div>

      <div class="memory-photo-wrap" id="memoryPhotoWrap">
        <img id="memoryPhoto" class="memory-photo" src="" alt="Our memory photo" />
        <div class="memory-photo-overlay"></div>
        <div class="memory-photo-caption">OUR MEMORY</div>
      </div>

      <p class="memory-note" id="memoryNote">Choose a star ❤️</p>
    </div>

    <div class="btn-row">
      <button class="btn-yes" id="continueBtn">Continue</button>
    </div>
    <p class="hint">all my favorite moments lead to one future</p>
  `;

  const note = document.getElementById("memoryNote");
  const photoWrap = document.getElementById("memoryPhotoWrap");
  const img = document.getElementById("memoryPhoto");

  let currentIndex = -1;
  let loadingToken = 0;

  function setNoteSmooth(text){
    note.classList.add("updating");
    setTimeout(()=>{
      note.textContent = text;
      note.classList.remove("updating");
    }, 140);
  }

  function revealMemory(index){
    if (index === currentIndex) return;
    currentIndex = index;
    const item = memoryCards[index];
    loadingToken++;

    setNoteSmooth(item.text);

    img.classList.remove("show");

    if (!item.photo){
      photoWrap.style.display = "none";
      return;
    }

    const tokenAtStart = loadingToken;
    const preloader = new Image();

    preloader.onload = () => {
      if (tokenAtStart !== loadingToken) return;
      img.src = item.photo;
      photoWrap.style.display = "block";

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          img.classList.add("show");
        });
      });
    };

    preloader.onerror = () => {
      if (tokenAtStart !== loadingToken) return;
      photoWrap.style.display = "none";
    };

    preloader.src = item.photo;
  }

  document.querySelectorAll(".memory-star").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      revealMemory(Number(btn.dataset.i));
    });
  });

  document.getElementById("continueBtn").addEventListener("click", ()=>{
    cardEl.classList.add("fade-out");
    setTimeout(()=>{
      cardEl.classList.remove("fade-out");
      renderFinal();
    }, 340);
  });
}

function renderFinal(){
  chapterLabelEl.innerHTML = `<span class="roman">V.</span> THE QUESTION`;

  cardEl.innerHTML = `
    ${mascotHtml("ring")}
    <div class="ring-wrap">
      <svg viewBox="0 0 100 100">
        <path class="ring-band" d="M50 90 A38 38 0 1 1 50.01 90" />
        <polygon class="ring-stone" points="50,28 57,40 50,52 43,40" />
      </svg>
    </div>
    <p class="final-title">Will you marry me?</p>
    <p class="final-sub">Every chapter before this one was me gathering courage to ask you this.</p>

    <div class="name-field">
      <label>your answer, in writing</label>
      <input type="text" id="nameInput" placeholder="type your name here" />
    </div>

    <div class="btn-row">
      <button class="btn-yes" id="yesBtn" style="font-size:17px; padding:16px 40px;">Yes, I will</button>
      <button class="btn-moment" id="momentBtn">I need a moment</button>
    </div>
    <p class="gentle-note" id="gentleNote"></p>
  `;

  document.getElementById("yesBtn").addEventListener("click", ()=>{
    const typedName = document.getElementById("nameInput").value.trim();
    celebrate(typedName);
  });

  document.getElementById("momentBtn").addEventListener("click", ()=>{
    document.getElementById("gentleNote").textContent = "Take all the time you need. My love is patient.";
  });
}

function celebrate(typedName){
  document.getElementById("stage").innerHTML = `
    <div class="card" style="animation:card-in .6s;">
      ${mascotHtml("final")}
      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <path class="ring-band" d="M50 90 A38 38 0 1 1 50.01 90" style="animation:none; stroke-dashoffset:0;" />
          <polygon class="ring-stone" points="50,28 57,40 50,52 43,40" style="animation:none; opacity:1;" />
        </svg>
      </div>
      <p class="final-title">You said yes.</p>
      <p class="final-sub">${typedName ? `— signed, ${escapeHtml(typedName)}` : "and every chapter after this one, we write together."}</p>
      <p class="signature">with love, ${getComputedStyle(document.documentElement).getPropertyValue('--your-name').replace(/['"]/g,'').trim()}</p>

      <div class="certificate-wrap" id="certWrap" style="display:none;">
        <img id="certPreview" class="cert-preview" alt="Certificate of engagement" />
        <a id="certDownloadBtn" class="btn-download" download="our-forever-yes.png">Download Certificate</a>
      </div>
    </div>
  `;
  chapterLabelEl.textContent = "";
  launchConfetti();
  generateCertificate(typedName);
}

/* Draws a downloadable certificate onto a canvas, with a background
   image behind the text. Replace CERT_BG_IMAGE with your own image path. */
const CERT_BG_IMAGE = "images/certificate-bg.jpg";
// 0 = keep top of photo, 0.5 = keep center, 1 = keep bottom.
// Nudge this if the crop cuts off faces you want visible.
const CERT_BG_FOCAL_Y = 0.42;

function generateCertificate(typedName){
  const displayName = typedName && typedName.trim() ? typedName.trim() : "My Love";
  const yourName = getComputedStyle(document.documentElement)
    .getPropertyValue('--your-name').replace(/['"]/g,'').trim();

  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 850;
  const ctx = canvas.getContext("2d");

  // draws an image "cover" style (like CSS background-size:cover) so it
  // never stretches — crops instead. focalY (0=top, 0.5=center, 1=bottom)
  // controls which part of the photo stays visible after cropping.
  function drawImageCover(image, focalY = 0.42){
    const canvasRatio = canvas.width / canvas.height;
    const imgRatio = image.width / image.height;
    let sx, sy, sw, sh;

    if (imgRatio > canvasRatio){
      // image is wider than canvas — crop the sides
      sh = image.height;
      sw = sh * canvasRatio;
      sx = (image.width - sw) / 2;
      sy = 0;
    } else {
      // image is taller than canvas — crop top/bottom, keep focal point
      sw = image.width;
      sh = sw / canvasRatio;
      sx = 0;
      sy = (image.height - sh) * focalY;
    }
    ctx.drawImage(image, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  }

  function drawFrameAndText(){
    // lighter overlay, concentrated near the top/bottom text bands rather
    // than washing out the middle of the photo where faces usually are
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0,    "rgba(42,15,27,0.62)");
    grad.addColorStop(0.28, "rgba(42,15,27,0.30)");
    grad.addColorStop(0.62, "rgba(42,15,27,0.28)");
    grad.addColorStop(1,    "rgba(42,15,27,0.66)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // decorative gold border
    ctx.strokeStyle = "#E8C36A";
    ctx.lineWidth = 6;
    ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(48, 48, canvas.width - 96, canvas.height - 96);

    ctx.textAlign = "center";

    ctx.fillStyle = "#E8C36A";
    ctx.font = "600 20px Inter, sans-serif";
    ctx.fillText("C E R T I F I C A T E   O F   A   F O R E V E R   Y E S", canvas.width / 2, 150);

    ctx.fillStyle = "#FFF9F2";
    ctx.font = "600 60px 'Cormorant Garamond', serif";
    ctx.fillText("This Is Us, Forever", canvas.width / 2, 240);

    ctx.fillStyle = "rgba(255,248,251,0.88)";
    ctx.font = "italic 26px 'Cormorant Garamond', serif";
    ctx.fillText("This certifies that on this day", canvas.width / 2, 340);

    ctx.fillStyle = "#E86D98";
    ctx.font = "600 62px 'Cormorant Garamond', serif";
    ctx.fillText(displayName, canvas.width / 2, 430);

    ctx.fillStyle = "rgba(255,248,251,0.88)";
    ctx.font = "italic 26px 'Cormorant Garamond', serif";
    ctx.fillText("said yes, and promised forever", canvas.width / 2, 490);

    const dateStr = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    ctx.fillStyle = "rgba(255,248,251,0.68)";
    ctx.font = "16px Inter, sans-serif";
    ctx.fillText(dateStr, canvas.width / 2, 570);

    ctx.fillStyle = "rgba(232,195,106,0.95)";
    ctx.font = "600 15px Inter, sans-serif";
    ctx.letterSpacing = "2px";
    ctx.fillText(`WITH LOVE, ${yourName.toUpperCase()}`, canvas.width / 2, 770);
    ctx.letterSpacing = "0px";

    finishCertificate();
  }

  function finishCertificate(){
    const dataUrl = canvas.toDataURL("image/png");
    const preview = document.getElementById("certPreview");
    const downloadBtn = document.getElementById("certDownloadBtn");
    const wrap = document.getElementById("certWrap");
    if (preview && downloadBtn && wrap){
      preview.src = dataUrl;
      downloadBtn.href = dataUrl;
      wrap.style.display = "block";
    }
  }

  // wait for the custom fonts to be ready so the canvas text renders correctly
  const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  ready.then(() => {
    const bg = new Image();
    bg.onload = () => {
      drawImageCover(bg, CERT_BG_FOCAL_Y);
      drawFrameAndText();
    };
    bg.onerror = () => {
      // no background image found — fall back to a plain gradient backdrop
      ctx.fillStyle = "#5A2B3F";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawFrameAndText();
    };
    bg.src = CERT_BG_IMAGE;
  });
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function spawnHeartEmojis(){
  const ambient = document.getElementById("ambient");
  const hearts = ["💖","💕","💗","💘","💞","💓","💝"];
  for (let i=0; i<24; i++){
    const h = document.createElement("span");
    h.className = "heart-float";
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = `${Math.random()*100}%`;
    h.style.bottom = `${-10 - Math.random()*35}px`;
    h.style.fontSize = `${15 + Math.random()*12}px`;
    h.style.setProperty("--drift", `${(Math.random()-0.5)*88}px`);
    h.style.animationDuration = `${11 + Math.random()*13}s`;
    h.style.animationDelay = `${Math.random()*10}s`;
    ambient.appendChild(h);
  }
}

function launchConfetti(){
  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ["#E86D98","#E8C36A","#FFF8FB","#CC4F7C","#FF9BB8"];
  const pieces = Array.from({ length: 150 }, () => ({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*.5,
    r: 4 + Math.random()*5,
    color: colors[Math.floor(Math.random()*colors.length)],
    speedY: 2 + Math.random()*3,
    speedX: (Math.random()-.5)*2,
    rotation: Math.random()*360,
    spin: (Math.random()-.5)*8,
    shape: Math.random()>.45 ? "rect" : "heart"
  }));

  let frame = 0;
  const maxFrames = 270;

  function drawHeart(x,y,size,color,rotation){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rotation*Math.PI/180);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, size*.3);
    ctx.bezierCurveTo(size, -size*.6, size*1.5, size*.5, 0, size*1.3);
    ctx.bezierCurveTo(-size*1.5, size*.5, -size, -size*.6, 0, size*.3);
    ctx.fill();
    ctx.restore();
  }

  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.spin;

      if (p.shape==="rect"){
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rotation*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.8);
        ctx.restore();
      } else {
        drawHeart(p.x,p.y,p.r*.62,p.color,p.rotation);
      }
    });

    frame++;
    if (frame < maxFrames) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  tick();
}

window.addEventListener("resize", ()=>{
  const canvas = document.getElementById("confettiCanvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

spawnHeartEmojis();
renderChapter();
</script>
